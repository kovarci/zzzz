<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paris · Académique</title>
  <meta name="description" content="Les conférences académiques à Paris, en un seul endroit." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       Design tokens
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg:            #07070d;
      --text:          #ececf2;
      --text-soft:     #c2c2d0;
      --muted:         #8888a0;
      --glass:         rgba(255,255,255,0.045);
      --glass-2:       rgba(255,255,255,0.07);
      --border:        rgba(255,255,255,0.09);
      --border-bright: rgba(255,255,255,0.2);
      --radius:        16px;

      --c-math:  #60a5fa;  --c-philo: #a78bfa;  --c-litt:  #fb7185;
      --c-hist:  #fb923c;  --c-sci:   #4ade80;  --c-eco:   #fbbf24;
      --c-socio: #2dd4bf;  --c-droit: #9aa6b8;  --c-arts:  #f472b6;
      --c-autre: #9ca3af;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════════════════
       Animated aurora background
       ═══════════════════════════════════════════════════════════════ */
    .aurora {
      position: fixed; inset: 0; z-index: -2;
      overflow: hidden; background: var(--bg);
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(110px); opacity: 0.5;
      will-change: transform;
    }
    .blob.b1 { width: 46vw; height: 46vw; background: #6d28d9;
               top: -12vw; left: -8vw;  animation: drift1 24s ease-in-out infinite; }
    .blob.b2 { width: 40vw; height: 40vw; background: #1d4ed8;
               top: 18vw;  right: -12vw; animation: drift2 30s ease-in-out infinite; }
    .blob.b3 { width: 38vw; height: 38vw; background: #be185d;
               bottom: -16vw; left: 22vw; animation: drift3 27s ease-in-out infinite; }
    .blob.b4 { width: 30vw; height: 30vw; background: #0e7490;
               top: 40vw; left: 36vw;    animation: drift1 33s ease-in-out infinite reverse; }
    @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(8vw,6vw) scale(1.15)} }
    @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-7vw,9vw) scale(1.1)} }
    @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(6vw,-8vw) scale(1.2)} }
    .aurora::after {
      content:""; position:absolute; inset:0;
      background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 4px 4px; opacity:.5;
    }

    /* ═══════════════════════════════════════════════════════════════
       Layout
       ═══════════════════════════════════════════════════════════════ */
    .container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

    /* ── Nav ─────────────────────────────────────────────────────── */
    nav.topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,18,0.6);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1240px; margin: 0 auto; padding: 15px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 10px;
            font-family: "Space Grotesk", sans-serif; font-weight: 600;
            font-size: 17px; letter-spacing: -0.01em; }
    .logo-orb {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(from 0deg, #a78bfa, #60a5fa, #f472b6, #a78bfa);
      box-shadow: 0 0 16px rgba(167,139,250,.7);
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nav-meta { font-size: 12.5px; color: var(--muted); }

    /* ── Hero ────────────────────────────────────────────────────── */
    .hero { padding: 76px 0 36px; text-align: center; }
    .hero .eyebrow {
      display: inline-block; font-size: 12px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--glass); margin-bottom: 22px;
    }
    .hero h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 700; line-height: 1.04; letter-spacing: -0.03em;
      margin-bottom: 20px;
      background: linear-gradient(140deg, #ffffff 18%, #b3a4ff 52%, #6da8ff 78%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 17px; color: var(--text-soft);
      max-width: 660px; margin: 0 auto 34px;
    }
    .hero p .count {
      font-weight: 700; color: #fff;
      font-variant-numeric: tabular-nums;
    }

    /* ── Search ──────────────────────────────────────────────────── */
    .search-wrap { position: relative; max-width: 560px; margin: 0 auto; }
    .search-input {
      width: 100%; padding: 16px 18px 16px 50px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      outline: none;
      border-color: rgba(167,139,250,0.6);
      background: var(--glass-2);
      box-shadow: 0 0 0 4px rgba(167,139,250,0.12), 0 0 40px rgba(109,40,217,0.25);
    }
    .search-icon {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════════════
       Controls
       ═══════════════════════════════════════════════════════════════ */
    .controls { padding: 32px 0 8px; }

    .tabs {
      display: flex; gap: 5px; padding: 5px; width: fit-content; margin: 0 auto 26px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .tab {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 18px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 500; font-family: inherit;
      color: var(--text-soft); background: none;
      border-radius: 10px; transition: all .18s;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(167,139,250,.9), rgba(96,165,250,.9));
      box-shadow: 0 6px 24px rgba(109,40,217,.4);
    }
    .tab .badge {
      font-size: 11px; font-weight: 700; padding: 1px 7px;
      border-radius: 999px; background: rgba(255,255,255,0.1); color: var(--text-soft);
    }
    .tab.active .badge { background: rgba(255,255,255,0.22); color: #fff; }

    .filter-block { margin-bottom: 14px; }
    .filter-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 6px 13px; cursor: pointer;
      font-size: 13px; font-family: inherit; color: var(--text-soft);
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 999px; transition: all .15s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--border-bright); color: #fff; }
    .chip.active {
      color: #fff; font-weight: 600;
      background: var(--glass-2);
      border-color: var(--chip-c, #fff);
      box-shadow: 0 0 18px -4px var(--chip-c, rgba(255,255,255,.5)),
                  inset 0 0 12px -8px var(--chip-c, #fff);
    }
    .chip.disc-Mathématiques { --chip-c: var(--c-math); }
    .chip.disc-Philosophie   { --chip-c: var(--c-philo); }
    .chip.disc-Littérature   { --chip-c: var(--c-litt); }
    .chip.disc-Histoire      { --chip-c: var(--c-hist); }
    .chip.disc-Sciences      { --chip-c: var(--c-sci); }
    .chip.disc-Économie      { --chip-c: var(--c-eco); }
    .chip.disc-Sociologie    { --chip-c: var(--c-socio); }
    .chip.disc-Droit         { --chip-c: var(--c-droit); }
    .chip.disc-Arts          { --chip-c: var(--c-arts); }
    .chip.disc-Autre         { --chip-c: var(--c-autre); }

    /* ── Toolbar ─────────────────────────────────────────────────── */
    .toolbar {
      margin-top: 22px; padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .results-text { font-size: 13px; color: var(--muted); }

    /* ═══════════════════════════════════════════════════════════════
       Events
       ═══════════════════════════════════════════════════════════════ */
    main { padding-bottom: 90px; }

    .day-group { margin-top: 44px; }
    .day-group:first-child { margin-top: 26px; }
    .day-header {
      display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px;
    }
    .day-name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: #fff;
    }
    .day-date { font-size: 13px; color: var(--muted); }
    .day-line { flex: 1; height: 1px; background: var(--border); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    .event-card {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 11px;
      padding: 19px;
      text-decoration: none; color: inherit;
      /* readable translucent panel — not pure black, aurora bleeds through */
      background: linear-gradient(160deg, rgba(28,28,46,0.74), rgba(17,17,29,0.74));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1),
                  border-color .25s, box-shadow .35s;
      animation: cardIn .5s ease both;
      animation-delay: calc(var(--d, 0) * 22ms);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } }
    .event-card::before {           /* discipline glow line at top */
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent, #888);
      box-shadow: 0 0 14px var(--accent, #888);
      opacity: .9;
    }
    .event-card .glare {
      position: absolute; inset: 0; pointer-events: none;
      border-radius: var(--radius); transition: background .2s;
    }
    .event-card:hover {
      border-color: var(--border-bright);
      box-shadow: 0 18px 50px -16px rgba(0,0,0,0.8),
                  0 0 44px -14px var(--accent, #888);
    }

    .card-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .card-time {
      font-size: 13px; font-weight: 600; color: #fff;
      font-variant-numeric: tabular-nums;
      font-family: "Space Grotesk", sans-serif;
    }
    .disc-tag {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
      color: var(--accent, #fff);
      background: color-mix(in srgb, var(--accent, #888) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent, #888) 40%, transparent);
      white-space: nowrap;
    }
    .card-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 16.5px; font-weight: 600; line-height: 1.32; color: #fff;
      letter-spacing: -0.01em;
    }
    .card-meta {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 13px; color: var(--text-soft);
    }
    .card-meta .institution { color: #fff; font-weight: 500; }
    .card-meta .row { display: flex; align-items: center; gap: 7px; }
    .card-meta svg { width: 13px; height: 13px; flex-shrink: 0; opacity: .6; }
    .card-desc {
      font-size: 12.5px; color: var(--muted); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .no-results {
      text-align: center; padding: 90px 20px; color: var(--muted);
    }
    .no-results .big {
      font-family: "Space Grotesk", sans-serif; font-size: 22px;
      color: var(--text-soft); margin-bottom: 8px;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0; text-align: center;
      font-size: 13px; color: var(--muted);
    }
    footer a { color: var(--text-soft); text-decoration: underline;
               text-underline-offset: 3px; text-decoration-color: var(--border-bright); }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero { padding: 50px 0 28px; }
      .container { padding: 0 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .tabs { width: 100%; }
      .tab { flex: 1; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .logo-orb, .event-card { animation: none; }
    }
  </style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
</div>

<!-- ── Nav ─────────────────────────────────────────────────────── -->
<nav class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-orb"></span>Paris·Académique</div>
    <div class="nav-meta" id="nav-meta">—</div>
  </div>
</nav>

<!-- ── Hero ────────────────────────────────────────────────────── -->
<header class="container hero">
  <span class="eyebrow">Mis à jour chaque jour</span>
  <h1>Toutes les conférences<br>académiques de Paris.</h1>
  <p>
    <span class="count" id="hero-count">0</span> événements à venir, agrégés depuis
    le Collège de France, l'ENS, l'EHESS, l'IHP, Sciences Po, la Sorbonne, PSE, PSL et Luma.
  </p>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input class="search-input" id="search" type="search"
           placeholder="Rechercher un titre, un intervenant, un sujet…" />
  </div>
</header>

<!-- ── Controls ────────────────────────────────────────────────── -->
<section class="container controls">
  <div class="tabs">
    <button class="tab active" data-source="all">Tout <span class="badge" id="badge-all">0</span></button>
    <button class="tab" data-source="institution">Universités <span class="badge" id="badge-inst">0</span></button>
    <button class="tab" data-source="luma">Luma <span class="badge" id="badge-luma">0</span></button>
  </div>

  <div class="filter-block">
    <div class="filter-label">Discipline</div>
    <div class="chips" id="discipline-chips"></div>
  </div>
  <div class="filter-block" id="institution-section">
    <div class="filter-label">Institution</div>
    <div class="chips" id="institution-chips"></div>
  </div>

  <div class="toolbar">
    <div class="results-text" id="results-text">—</div>
  </div>
</section>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main class="container">
  <div id="list-view"></div>
</main>

<footer class="container">
  Agrégé automatiquement chaque matin · <a href="https://github.com/kovarci/zzzz" target="_blank">Code source</a>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────
const DISC_COLORS = {
  "Mathématiques":              "#60a5fa",
  "Philosophie":                "#a78bfa",
  "Littérature":                "#fb7185",
  "Histoire":                   "#fb923c",
  "Sciences":                   "#4ade80",
  "Économie":                   "#fbbf24",
  "Sociologie & Anthropologie": "#2dd4bf",
  "Droit & Sciences politiques":"#9aa6b8",
  "Arts & Culture":             "#f472b6",
  "Autre":                      "#9ca3af",
};
const DAYS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ICONS = {
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  pin:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
};

let allEvents = [], activeSource = "all";
let activeDiscs = new Set(), activeInsts = new Set();
let searchQuery = "";

// ── Load ─────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const r = await fetch("data/events.json?" + Date.now());
    allEvents = await r.json();
    allEvents.forEach(e => { if (!e.source_type) e.source_type = "institution"; });
    allEvents.sort((a,b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
    document.getElementById("nav-meta").textContent =
      "Mis à jour le " + new Date().toLocaleDateString("fr-FR", {day:"numeric",month:"long"});
    buildFilters();
    updateBadges();
    render();
  } catch (e) {
    document.getElementById("list-view").innerHTML =
      `<div class="no-results"><div class="big">Erreur de chargement</div><div>${e.message}</div></div>`;
  }
}

// ── Filters ──────────────────────────────────────────────────────
function buildFilters() {
  const order = ["Mathématiques","Philosophie","Littérature","Histoire","Sciences","Économie","Sociologie & Anthropologie","Droit & Sciences politiques","Arts & Culture","Autre"];
  const discs = [...new Set(allEvents.map(e => e.discipline))].sort((a,b) => order.indexOf(a)-order.indexOf(b));
  const insts = [...new Set(allEvents.filter(e => e.source_type==="institution").map(e => e.institution))].sort();

  const dc = document.getElementById("discipline-chips");
  dc.innerHTML = "";
  discs.forEach(d => {
    const btn = document.createElement("button");
    btn.className = `chip disc-${d.split(" ")[0]}`;
    btn.textContent = d;
    btn.addEventListener("click", () => {
      btn.classList.toggle("active");
      activeDiscs.has(d) ? activeDiscs.delete(d) : activeDiscs.add(d);
      render();
    });
    dc.appendChild(btn);
  });

  const ic = document.getElementById("institution-chips");
  ic.innerHTML = "";
  insts.forEach(i => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = i;
    btn.addEventListener("click", () => {
      btn.classList.toggle("active");
      activeInsts.has(i) ? activeInsts.delete(i) : activeInsts.add(i);
      render();
    });
    ic.appendChild(btn);
  });
}

function updateBadges() {
  const inst = allEvents.filter(e => e.source_type==="institution").length;
  const luma = allEvents.filter(e => e.source_type==="luma").length;
  document.getElementById("badge-all").textContent = allEvents.length;
  document.getElementById("badge-inst").textContent = inst;
  document.getElementById("badge-luma").textContent = luma;
  animateCount(document.getElementById("hero-count"), allEvents.length);
}

function animateCount(el, target) {
  let cur = 0; const step = Math.max(1, Math.ceil(target/45));
  const t = setInterval(() => {
    cur += step;
    if (cur >= target) { cur = target; clearInterval(t); }
    el.textContent = cur;
  }, 22);
}

function filtered() {
  const q = searchQuery.toLowerCase().trim();
  return allEvents.filter(e => {
    if (activeSource !== "all" && e.source_type !== activeSource) return false;
    if (activeDiscs.size && !activeDiscs.has(e.discipline)) return false;
    if (activeInsts.size && !activeInsts.has(e.institution)) return false;
    if (q) {
      const hay = (e.title+" "+e.speaker+" "+e.description+" "+e.institution).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── Render ───────────────────────────────────────────────────────
function escHtml(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtDayHeader(iso) {
  const d = new Date(iso + "T12:00:00");
  return { name: DAYS_FR[d.getDay()], date: `${d.getDate()} ${MONTHS_FR[d.getMonth()]}` };
}
function groupByDate(events) {
  const g = new Map();
  events.forEach(e => { if (!g.has(e.date)) g.set(e.date, []); g.get(e.date).push(e); });
  return g;
}

function cardHtml(ev, idx) {
  const color = DISC_COLORS[ev.discipline] ?? "#9ca3af";
  const time = ev.time ? (ev.end_time ? `${ev.time}–${ev.end_time}` : ev.time) : "Horaire à confirmer";
  const inst = ev.source_type === "luma" ? `${escHtml(ev.institution)} · Luma` : escHtml(ev.institution);
  return `
    <a class="event-card" href="${escHtml(ev.url || "#")}" target="_blank" rel="noopener"
       style="--accent:${color};--d:${Math.min(idx,26)}">
      <span class="glare"></span>
      <div class="card-top">
        <span class="card-time">${escHtml(time)}</span>
        <span class="disc-tag">${escHtml(ev.discipline)}</span>
      </div>
      <div class="card-title">${escHtml(ev.title)}</div>
      <div class="card-meta">
        <div class="institution">${inst}</div>
        ${ev.speaker ? `<div class="row">${ICONS.user}<span>${escHtml(ev.speaker)}</span></div>` : ""}
        ${ev.location ? `<div class="row">${ICONS.pin}<span>${escHtml(ev.location)}</span></div>` : ""}
      </div>
      ${ev.description ? `<div class="card-desc">${escHtml(ev.description)}</div>` : ""}
    </a>`;
}

function renderList(events) {
  const container = document.getElementById("list-view");
  if (!events.length) {
    container.innerHTML = `<div class="no-results">
      <div class="big">Aucune conférence trouvée</div>
      <div>Essayez de retirer un filtre ou de modifier votre recherche.</div></div>`;
    return;
  }
  let html = "", idx = 0;
  for (const [iso, evs] of groupByDate(events)) {
    const h = fmtDayHeader(iso);
    html += `<div class="day-group">
      <div class="day-header">
        <span class="day-name">${h.name}</span>
        <span class="day-date">${h.date}</span>
        <span class="day-line"></span>
      </div>
      <div class="cards-grid">${evs.map(e => cardHtml(e, idx++)).join("")}</div>
    </div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll(".event-card").forEach(attachTilt);
}

// ── 3D tilt ──────────────────────────────────────────────────────
function attachTilt(card) {
  const glare = card.querySelector(".glare");
  card.addEventListener("pointerenter", () => { card.style.transition = "transform .08s linear"; });
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    card.style.transform =
      `perspective(820px) rotateY(${(px-.5)*9}deg) rotateX(${(.5-py)*9}deg) translateY(-5px) scale(1.018)`;
    if (glare)
      glare.style.background =
        `radial-gradient(420px circle at ${px*100}% ${py*100}%, rgba(255,255,255,.12), transparent 55%)`;
  });
  card.addEventListener("pointerleave", () => {
    card.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1)";
    card.style.transform = "";
    if (glare) glare.style.background = "";
  });
}

// ── Main render ──────────────────────────────────────────────────
function render() {
  const evs = filtered();
  document.getElementById("results-text").textContent =
    `${evs.length} résultat${evs.length>1?"s":""}`;
  renderList(evs);
}

// ── Listeners ────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    activeSource = btn.dataset.source;
    document.getElementById("institution-section").style.display =
      activeSource === "luma" ? "none" : "";
    render();
  });
});
let searchTimer;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQuery = e.target.value; render(); }, 200);
});

loadEvents();
</script>
</body>
