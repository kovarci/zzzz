name: Source audit (temporaire)

# Lecture seule : exécute chaque scraper et détaille les sources à 0.
# Ne committe rien, n'écrit rien dans data/, n'appelle pas IndexNow.
on:
  push:
    branches: ["claude/**"]
    paths:
      - "scraper/audit_sources.py"
      - "scraper/_probe.py"
      - "scraper/scrape.py"
      - ".github/workflows/source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt pytest
      - name: Tests
        run: python -m pytest scraper/tests -q
      - name: Sonde
        run: python scraper/_probe.py
        env:
          PYTHONUNBUFFERED: "1"
