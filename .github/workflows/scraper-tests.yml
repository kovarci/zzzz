name: Scraper tests

# Les régressions du scraper se découvraient le lendemain, dans un run
# nocturne rouge (soupsieve 3 qui refuse un sélecteur, brotli illisible…).
# Ces tests tournent sur chaque modification du scraper, avec les mêmes
# versions épinglées que le robot.
on:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-tests.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt pytest
      - run: python -m pytest scraper/tests -q
