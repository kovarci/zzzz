name: Daily Conference Scrape

on:
  schedule:
    - cron: "0 4 * * *"  # 06:00 Paris (summer) / 05:00 (winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scrape.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ e/ i/ d/ sitemap.xml og.png *.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update conference data $(date -u +'%Y-%m-%d')"
            # Si quelqu'un a poussé pendant le scrape (code, maj.bat…), on se
            # remet à jour avant de pousser. -X theirs : en cas de conflit sur
            # un fichier de données, la version fraîche du robot l'emporte.
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            exit 1
          fi

      # APRÈS le commit : grâce au report, une source en panne garde ses
      # événements des jours précédents — rien de dégradé à publier. Placé
      # avant, un seul site en panne gelait la mise à jour des 60 autres.
      # Le run échoue quand même (e-mail de GitHub) si une source majeure
      # n'a rien ramené.
      - name: Check sources health
        run: python scraper/check_health.py
