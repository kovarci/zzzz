name: probe tmp
on:
  push:
    branches: ["claude/probe-tmp"]
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt}
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/_probe.py
